services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secom
      POSTGRES_PASSWORD: secom_local
      POSTGRES_DB: secom
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["secom_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secom"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://secom:secom_local@db:5432/secom
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  dashboard:
    build: .
    environment:
      API_URL: http://api:8000
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
volumes:
  secom_db:
